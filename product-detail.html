    <style>
        .product-info p {
            display: -webkit-box;
            -webkit-line-clamp: 3;

            overflow: hidden;
        }
        .state-box { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #666; }
        .state-box i { font-size: 28px; color: #9B2226; margin-bottom: 12px; display: block; }
        .state-box button { margin-top: 14px; background: #9B2226; color: #fff; border: none; padding: 10px 26px; border-radius: 30px; cursor: pointer; font-family: inherit; font-size: 14px; }
        .qty-box { display: flex; align-items: center; border: 1px solid #E8E2D6; border-radius: 30px; overflow: hidden; background: #FCF9F2; }
        .qty-box button { background: transparent; border: none; width: 40px; height: 40px; cursor: pointer; font-size: 16px; color: #5A3E2B; transition: background .2s; }
        .qty-box button:hover { background: #E8E2D6; }
        .qty-box input { width: 50px; text-align: center; border: none; background: transparent; font-size: 16px; font-weight: 600; color: #2B2D42; outline: none; font-family: inherit; }
        .btn-add-cart, .btn-buy-now { cursor: pointer; font-family: inherit; }
        .btn-disabled { opacity: .5; pointer-events: none; }
        .stock-note { font-size: 12px; color: #9B2226; }
    </style>

    /* ส่วนลิขสิทธิ์ด้านล่างสุด */

</style>

<script>
(function () {
    var box = document.getElementById('productDetail');
    var id = new URLSearchParams(location.search).get('id');

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function message(icon, text, withRetry) {
        box.innerHTML = '<div class="state-box"><i class="fa-solid ' + icon + '"></i>' + esc(text) +
            (withRetry ? '<br><button type="button" id="retryBtn">ลองใหม่</button>' : '') + '</div>';
        if (withRetry) document.getElementById('retryBtn').addEventListener('click', load);
    }

    function render(p) {
        document.title = 'VOLCANNO | ' + p.name;
        var soldOut = p.stock < 1;
        var check = function (t) {
            return '<div><i class="fa-solid fa-check" style="color:#9B2226;margin-right:5px;"></i> ' + t + '</div>';
        };
        var buy = soldOut
            ? '<div style="text-align:center;padding:14px;background:#F0ECE1;border-radius:30px;color:#888;">สินค้าหมดชั่วคราว</div>'
            : '<div style="display:flex;align-items:center;gap:15px;margin-bottom:25px;">' +
                  '<span style="font-size:15px;color:#333;font-weight:500;">จำนวน:</span>' +
                  '<div class="qty-box">' +
                      '<button type="button" id="decBtn">-</button>' +
                      '<input type="number" id="quantityInput" value="1" min="1" max="' + p.stock + '" readonly>' +
                      '<button type="button" id="incBtn">+</button>' +
                  '</div>' +
                  '<span class="stock-note">' + (p.stock <= 10 ? 'เหลือ ' + p.stock + ' ชิ้น' : '') + '</span>' +
              '</div>' +
              '<div style="display:flex;gap:15px;">' +
                  '<button type="button" id="addBtn" class="btn-primary" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:30px;border:none;font-family:inherit;font-size:15px;cursor:pointer;"><i class="fa-solid fa-cart-shopping"></i> เพิ่มลงตะกร้าสินค้า</button>' +
                  '<button type="button" id="buyBtn" class="btn-outline" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #9B2226;background:transparent;color:#9B2226;padding:14px;border-radius:30px;font-family:inherit;font-size:15px;cursor:pointer;"><i class="fa-solid fa-bag-shopping"></i> สั่งซื้อทันที</button>' +
              '</div>';

        box.innerHTML =
            '<div class="detail-card">' +
                '<div><img class="detail-img" src="' + esc(encodeURI(p.image)) + '" alt="' + esc(p.name) + '"></div>' +
                '<div>' +
                    (p.badge ? '<span class="hero-badge" style="margin-bottom:15px;">' + esc(p.badge) + '</span>' : '') +
                    '<h1 style="font-size:32px;color:#2B2D42;margin-bottom:10px;">' + esc(p.name) + ' VOLCANNO</h1>' +
                    '<div style="font-size:28px;font-weight:600;color:#9B2226;margin-bottom:20px;">' + p.price + ' บาท <span style="font-size:14px;color:#888;font-weight:400;">/ แพ็ก</span></div>' +
                    '<p style="color:#666;font-size:15px;line-height:1.8;margin-bottom:20px;">' + esc(p.description) + '</p>' +
                    '<div style="display:flex;flex-wrap:wrap;gap:12px 20px;margin-bottom:30px;font-size:14px;color:#555;">' +
                        check('เนื้อปลาแท้ 100%') + check('ไม่ใส่สารกันบูด') + check('แช่แข็งคงความสด') +
                    '</div>' + buy +
                '</div>' +
            '</div>';

        if (soldOut) return;
        var input = document.getElementById('quantityInput');
        document.getElementById('incBtn').onclick = function () {
            if (+input.value < p.stock && +input.value < 99) input.value = +input.value + 1;
        };
        document.getElementById('decBtn').onclick = function () {
            if (+input.value > 1) input.value = +input.value - 1;
        };
        document.getElementById('addBtn').onclick = function () {
            var r = Cart.add(p.id, +input.value, p.stock);
            Cart.toast(r.capped
                ? 'ใส่ได้สูงสุด ' + p.stock + ' ชิ้นตามสต็อก (ในตะกร้ามี ' + r.qty + ' ชิ้น)'
                : 'เพิ่ม ' + p.name + ' ลงตะกร้าแล้ว', r.capped);
        };
        document.getElementById('buyBtn').onclick = function () {
            Cart.add(p.id, +input.value, p.stock);
            location.href = 'order.html';
        };
    }

    async function load() {
        if (!id) { message('fa-circle-question', 'ไม่ระบุสินค้า กรุณาเลือกสินค้าจากหน้าสินค้า'); return; }
        message('fa-spinner fa-spin', 'กำลังโหลดสินค้า...');
        try {
            var list = await Api.getProducts();
            var p = list.filter(function (x) { return x.id === id; })[0];
            if (!p) { message('fa-circle-question', 'ไม่พบสินค้านี้ หรือสินค้าถูกนำออกจากการขายแล้ว'); return; }
            render(p);
        } catch (e) {
            message('fa-triangle-exclamation', e.message, true);
        }
    }
    load();
})();
</script>
